name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Forzar orientación horizontal
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(p, 'utf8');
            xml = xml.replace('<activity', '<activity\n            android:screenOrientation=\"landscape\"');
            fs.writeFileSync(p, xml);
          "

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: AeroLightning-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
