window.onerror = function(msg, url, line) {
  try {
    const u = new SpeechSynthesisUtterance('Error detectado. ' + msg + '. Línea ' + line);
    u.lang = 'es-ES';
    window.speechSynthesis.speak(u);
  } catch (e) {}
};
window.addEventListener('unhandledrejection', function(e) {
  try {
    const u = new SpeechSynthesisUtterance('Error de promesa. ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    u.lang = 'es-ES';
    window.speechSynthesis.speak(u);
  } catch (err) {}
});

class AudioManager {
  constructor() {
    this.buffers = {}; this.loops = {}; this.queue = []; this.busy = false;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
  }
  async loadAll() {
    await Promise.all(Object.entries(SOUND_FILES).map(async ([k, url]) => {
      try {
        const r = await fetch(encodeURI(url));
        if (!r.ok) throw new Error('no encontrado');
        this.buffers[k] = await this.ctx.decodeAudioData(await r.arrayBuffer());
      } catch (e) { console.warn('No cargó: ' + k); }
    }));
  }
